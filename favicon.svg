<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="#0a0a0a"/>

  <!-- Outer ring -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#e50914" stroke-width="2"/>

  <!-- Film reel spokes -->
  <circle cx="16" cy="16" r="4" fill="#e50914"/>

  <!-- 6 sprocket holes around the ring -->
  <circle cx="16" cy="5"  r="2" fill="#e50914"/>
  <circle cx="16" cy="27" r="2" fill="#e50914"/>
  <circle cx="5"  cy="16" r="2" fill="#e50914"/>
  <circle cx="27" cy="16" r="2" fill="#e50914"/>
  <circle cx="7.8"  cy="7.8"  r="2" fill="#e50914"/>
  <circle cx="24.2" cy="24.2" r="2" fill="#e50914"/>

  <!-- Center hub -->
  <circle cx="16" cy="16" r="2" fill="#0a0a0a"/>
</svg>
